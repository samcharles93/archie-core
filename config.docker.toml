# Docker Compose overrides for the inprocess config.
# Only set fields that differ: paths (container filesystem) and
# container-specific configuration. Everything else inherits from
# config.toml (inprocess config), which is the single source of truth.
#
# Mount this at /etc/archie/config.toml AND the base config so TOML
# merging works. Or better: the daemon loads both — base first, then
# this overlay.

work_dir = "/var/lib/archie/work"
db_path = "/var/lib/archie/archie.db"

[agent]
mode = "nats"

[nats]
url = "nats://nats:4222"

[containers]
enabled = true
image = "git.catlow.cloud/sam/archie-agent:latest"
max_concurrency = 4
max_uptime = "60m"
pull_policy = "missing"

[web]
listen = "0.0.0.0:8484"

# Repos: same as inprocess config — keep in sync with config.toml.
# TODO: support `include` directive so repos list is not duplicated.

[[repos]]
owner = "sam"
name = "archie-core"
base = "main"
ecosystem = "go"
gate = [
  ["gofumpt", "-w", "."],
  ["go", "fix", "./..."],
  ["go", "vet", "./..."],
  ["go", "build", "./..."],
  ["go", "test", "./...", "-count=1"],
]

[[repos]]
owner = "sam"
name = "tau"
base = "main"
ecosystem = "go"
gate = [
  ["gofumpt", "-w", "."],
  ["go", "fix", "./..."],
  ["go", "vet", "./..."],
  ["golangci-lint", "run"],
  ["go", "test", "./...", "-count=1"],
]
protect = ["_templ.go"]
