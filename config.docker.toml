# Docker Compose overlay: only fields that differ from the base config.
# The daemon loads both  --  base config.toml first, then this file on top
# (config.LoadOverlay)  --  so config.toml (the same file inprocess mode
# reads) stays the single source of truth for bot_user, forge, dispatch,
# models, providers, budgets, and repos. See docker-compose.yml's
# `-config` / `-config-overlay` flags and volume mounts.

work_dir = "/var/lib/archie/work"
db_path = "/var/lib/archie/archie.db"

[agent]
mode = "nats"

[nats]
url = "nats://nats:4222"

[containers]
enabled = true
image = "git.catlow.cloud/sam/archie-agent:latest"
max_concurrency = 4
max_uptime = "60m"
pull_policy = "missing"

[web]
listen = "0.0.0.0:8484"
