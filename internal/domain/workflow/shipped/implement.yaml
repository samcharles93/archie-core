id: implement
steps:
  - type: repo.prepare
  - type: gate.repository
    settings:
      repair: true
  - id: plan
    type: agent.run
    settings:
      read_only: true
      mission: |
        Produce a concrete implementation plan for this {{ task.kind }} on the repository {{ task.repository }}.

        {{ task.plan }}

        {{ task.prompt }}

        Explore the codebase with your read-only tools, then call finish with status "passed" and the plan as the summary: files to touch, the approach, acceptance criteria, and what tests should prove it. Keep the plan tightly scoped to the task. Call finish with status "blocked" if the task is too vague or too large for one PR.
  - id: build
    type: agent.run
    settings:
      gate: repository
      extra_rules: Files matching the repository's protected suffixes (e.g. generated code) are write-blocked. Edit their sources instead; the gate regenerates them.
      mission: |
        Implement this {{ task.kind }} on the repository {{ task.repository }}, following the plan below.

        {{ task.prompt }}

        <plan>
        {{ steps.plan.summary }}
        </plan>

        Make the smallest change that satisfies the task and the plan's acceptance criteria. Do not run git: the orchestrator commits and pushes for you. When done, call finish with status "passed" and a summary written for the human who will review the pull request: what changed, why, and how it was verified.
  - type: repo.commit
    settings:
      message: "{{ task.title }} (archie)"
      reference: Implements
      push: true
      if_empty: complete
  - type: gate.diff-size
  - type: repo.open-pr
    settings:
      review: true
      body: "{{ steps.build.summary }}"
