# golangci-lint configuration for archie-core.
#
# Schema: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# Every option is documented upstream in .golangci.reference.yml.
# Validate changes with `golangci-lint config verify` before committing.
#
# Philosophy: this repo's gate is `task check`, and archied runs that same
# gate against its own PRs. A linter here is therefore an environmental
# constraint an agent cannot argue its way around -- the doctrine CLAUDE.md
# applies to safety, applied to structure. Curated over exhaustive: a noisy
# gate gets disabled, and a disabled gate enforces nothing.
version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.26"

linters:
  default: standard
  enable:
    # Structure and complexity
    - cyclop
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif

    # Architecture
    - importas
    - interfacebloat

    # Correctness
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - fatcontext
    - forcetypeassert
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck

    # Idiom and hygiene
    - gocritic
    - godox
    - misspell
    - predeclared
    - sloglint
    - unconvert
    - usestdlibvars
    - usetesting

  settings:
    cyclop:
      max-complexity: 15
    dupl:
      threshold: 150
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    maintidx:
      under: 20
    nestif:
      min-complexity: 5

    godox:
      # Tracked work lives in GitHub Issues.
      keywords:
        - FIXME
        - TODO
        - HACK
        - BUG

    interfacebloat:
      max: 8

    sloglint:
      no-mixed-args: true
      key-naming-case: snake

  exclusions:
    generated: lax
    warn-unused: true
    # npm dependencies are not this module's code. `flatted`, pulled in
    # transitively by the dashboard toolchain, ships a Go implementation
    # alongside its JavaScript, and linting a vendored third-party file fails
    # the gate on complexity nobody here can fix.
    paths:
      - ui/node_modules
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Table-driven tests are supposed to resemble each other, and
      # splitting one to satisfy a complexity budget makes it harder to
      # read. Correctness linters still apply to tests.
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - funlen
          - gocognit
          - gocyclo
          - maintidx

formatters:
  # goimports is deliberately absent. golangci-lint's goimports formatter
  # builds a fresh x/tools ProcessEnv per file, so internal/imports re-reads
  # and re-parses $GOMODCACHE's module index once per file -- 63 MiB here,
  # ~155ms each, ~135s across this tree, and again on a cold `golangci-lint
  # run`. gofumpt and gci cover formatting and grouping; a missing or unused
  # import is a compile error, and formatter drift is reported by run itself.
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      # Matches the grouping already used across this repo.
      sections:
        - standard
        - default
        - prefix(github.com/samcharles93/archie-core)
      custom-order: true
  exclusions:
    generated: strict
    # These Yaegi programs sit behind //go:build ignore, so a formatter cannot
    # type-check them: rewriting their imports deletes the genuinely used
    # internal/secret import and the interpreter can no longer load them.
    # Excluded from every formatter so adding one cannot reintroduce that.
    paths:
      - ^examples/secret-engines/(age|sops|vault)\.go$

issues:
  # 0 = report everything. The defaults (50 per linter, 3 per message)
  # silently truncate, which turns the issue count into a number you
  # cannot track downward.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  show-stats: true
  sort-order:
    - linter
    - file
