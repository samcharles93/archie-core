# archie-core stack: daemon, NATS, and agent containers.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f archied

services:
  # ── NATS JetStream ────────────────────────────────────────────────
  nats:
    image: nats:2.14-alpine3.22
    command: -js -m 8222
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring (http://localhost:8222)
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── archie daemon ──────────────────────────────────────────────────
  archied:
    image: git.catlow.cloud/sam/archied:latest
    command: -config /etc/archie/config.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8484:8484"   # web dashboard
    environment:
      - ARCHIE_GITEA_TOKEN
      - DEEPSEEK_API_KEY
    volumes:
      - ./config.docker.toml:/etc/archie/config.toml:ro
      - archie_work:/var/lib/archie/work
      - archie_db:/var/lib/archie
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ── agent image (built once, spawned by daemon) ────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: git.catlow.cloud/sam/archie-agent:latest
    command: ["true"]
    entrypoint: [""]
    restart: "no"

volumes:
  nats_data:
  archie_work:
  archie_db:
