version: "3"

vars:
  BIN_DIR: "bin"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format and fix Go source (gofumpt, go fix)
    cmds:
      - gofumpt -w .
      - go fix ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  ui:
    desc: Build the dashboard into ui/dist (committed; the Go build embeds it)
    dir: ui
    cmds:
      - npm install --no-audit --no-fund
      - npm run build

  dev:
    desc: "Develop: archied live-reload + Vite HMR together. Open http://localhost:5173"
    summary: |
      Runs both halves of the dev loop in one terminal:

        * air        rebuilds and restarts archied on Go changes
        * vite       serves the dashboard with hot reload on :5173,
                     proxying /api and /events through to archied on :8484

      Open http://localhost:5173 -- not :8484. The Vite server is the one with
      hot reload; :8484 serves the last built dist/ and will look stale.

      Ctrl-C stops both.
    deps: [dev:daemon, dev:ui]

  dev:daemon:
    desc: archied only, live-reloading via air (prefer `task dev`)
    cmds:
      - air

  dev:ui:
    desc: Vite dev server only, expects archied already running (prefer `task dev`)
    dir: ui
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  build:
    desc: Build archied and archie-agent binaries
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/archied"
      - "{{.BIN_DIR}}/archie-agent"
    cmds:
      - go build -o {{.BIN_DIR}}/archied ./cmd/archied
      - go build -o {{.BIN_DIR}}/archie-agent ./cmd/archie-agent

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./... -count=1

  check:
    desc: "Full quality gate: fmt, go fix, vet, build, test (matches [[repos.gate]] in config.toml)"
    cmds:
      - task: fmt
      - go fix ./...
      - task: vet
      - task: build
      - task: test

  release:preview:
    desc: "Show the release notes that would be generated (VERSION=1.2.0, or GATEWAY=/RUNTIME= to version the two components separately)"
    cmds:
      - tools/release.sh --gateway {{.GATEWAY | default .VERSION}} --runtime {{.RUNTIME | default .VERSION}} --dry-run
    requires:
      vars: [VERSION]

  release:prepare:
    desc: "Write the generated notes into the changelogs, uncommitted, for editing (VERSION=1.2.0)"
    cmds:
      - tools/release.sh --gateway {{.GATEWAY | default .VERSION}} --runtime {{.RUNTIME | default .VERSION}} --prepare
    requires:
      vars: [VERSION]

  release:
    desc: "Freeze the edited changelogs into a release commit and tags (VERSION=1.2.0). Run release:prepare first."
    cmds:
      - tools/release.sh --gateway {{.GATEWAY | default .VERSION}} --runtime {{.RUNTIME | default .VERSION}} --tag
    requires:
      vars: [VERSION]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  docker-build:
    desc: Build the archie-agent sandbox image
    cmds:
      - docker compose build agent

  docker-up:
    desc: Start the archied + NATS stack via docker compose
    cmds:
      - docker compose up -d

  docker-down:
    desc: Stop the docker compose stack
    cmds:
      - docker compose down

  docker-logs:
    desc: Follow the archied container logs
    cmds:
      - docker compose logs -f archied
