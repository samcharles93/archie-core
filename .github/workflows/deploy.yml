# Builds and pushes the archied and archie-agent images to GHCR on every
# merge to main. Mirrors .gitea/workflows/deploy.yml, which remains the
# production build path against git.catlow.cloud until that's cut over.
name: deploy

on:
  push:
    branches: [main]
    tags: ["archied/v*", "archie/v*"]

# Rapid successive pushes to main (a release commit right after its
# preceding fix, say) previously queued a full gate+build for each one,
# several minutes apiece, with no caching -- so a burst of pushes left
# three deploys racing in parallel for the same runner capacity. Only the
# last one's images matter (both jobs push :latest), so cancel a
# superseded run rather than let it fight for resources it can't use.
#
# Keyed on the commit, not github.ref: `git push --follow-tags` pushes
# main plus both archied/v* and archie/v* tags in one go, and all three
# refs point at the same commit -- on.push matches branches and tags
# both, so a single release push otherwise fires three redundant builds
# of identical content that a ref-keyed group can't see as the same work.
concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Quality gate
        run: |
          gofumpt -w .
          go fix ./...
          go vet ./...
          go build ./...
          go test ./... -count=1

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The dashboard suite runs in CI too, or it only ever runs when
      # someone remembers to; the Go steps above never touch it.
      - name: Dashboard tests
        run: |
          npm ci --prefix ui || npm install --prefix ui
          npm test --prefix ui

      - name: Release tags must match changelogs
        run: |
          set -e
          fail=0
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              archied/v*)
                # Strip the "v" too: tags are archied/vX.Y.Z, changelog
                # sections are "## [X.Y.Z]" (see tools/release.sh).
                ver="${tag#archied/v}"
                echo "  archied tag $tag  ->  looking for [$ver] in CHANGELOG.archied.md"
                grep -q "^## \\[$ver\\]" CHANGELOG.archied.md || {
                  echo "  FAIL: CHANGELOG.archied.md has no [$ver] section"
                  fail=1
                }
                ;;
              archie/v*)
                ver="${tag#archie/v}"
                echo "  archie tag $tag  ->  looking for [$ver] in CHANGELOG.archie.md"
                grep -q "^## \\[$ver\\]" CHANGELOG.archie.md || {
                  echo "  FAIL: CHANGELOG.archie.md has no [$ver] section"
                  fail=1
                }
                ;;
            esac
          done
          if [ $fail -ne 0 ]; then
            echo
            echo "A release tag points at this commit but its changelog does not"
            echo "describe that version. Run: task release:prepare VERSION=<ver>"
            echo "edit the generated notes, then: task release VERSION=<ver>"
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -qE 'archie' ; then
            echo "::warning ::No release tags at HEAD  --  images will be stamped 'dev'"
          fi

  build-and-push:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve component versions
        id: versions
        run: |
          GATEWAY_TAG="$(git tag --points-at HEAD --list 'archied/v*' | sort -V | tail -1)"
          RUNTIME_TAG="$(git tag --points-at HEAD --list 'archie/v*' | sort -V | tail -1)"
          GATEWAY_VERSION="${GATEWAY_TAG#archied/}"
          RUNTIME_VERSION="${RUNTIME_TAG#archie/}"
          [ -n "$GATEWAY_VERSION" ] || GATEWAY_VERSION=dev
          [ -n "$RUNTIME_VERSION" ] || RUNTIME_VERSION=dev
          # Keep the raw tag presence separate from the version fallback:
          # gateway-only releases must not rebuild the runtime image as dev.
          echo "gateway_tag=$GATEWAY_TAG" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=$RUNTIME_TAG" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push archied
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.archied
          push: true
          tags: ghcr.io/samcharles93/archied:latest
          build-args: |
            GATEWAY_VERSION=${{ steps.versions.outputs.gateway }}
            RUNTIME_VERSION=${{ steps.versions.outputs.runtime }}
          cache-from: type=gha,scope=archied
          cache-to: type=gha,mode=max,scope=archied

      - name: Build and push archie-agent
        if: steps.versions.outputs.runtime_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/samcharles93/archie-agent:latest
          build-args: |
            RUNTIME_VERSION=${{ steps.versions.outputs.runtime }}
          cache-from: type=gha,scope=archie-agent
          cache-to: type=gha,mode=max,scope=archie-agent
