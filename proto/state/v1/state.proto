message RemoveInstalledPackageRequest {
  reserved 1;
  reserved "org_id";
  string name = 2;
}
message RemoveInstalledPackageResponse {}
message UpdatePackageRequest { string name = 1; }
message UpdatePackageResponse { InstalledPackage package = 1; }
message ApprovePackageUpdateRequest { string name = 1; }
message ApprovePackageUpdateResponse { InstalledPackage package = 1; }
message RollbackPackageRequest { string name = 1; }
message RollbackPackageResponse { InstalledPackage package = 1; }
message SetPackageUpdatePolicyRequest {
  string name = 1;
  string policy = 2;
}
message SetPackageUpdatePolicyResponse { InstalledPackage package = 1; }

// Task mirrors internal/domain/workflow.Task.

message GetPrincipalRequest { string identity_id = 1; }
// PrincipalMembership mirrors org.Membership: an identity's role in an org,
// or in one workspace of it.
message PrincipalMembership {
  string org_id = 1;
  string workspace_id = 2;
  string role = 3;
}
message AccessPrincipal {
  string identity_id = 1;
  string org_id = 2;
  repeated PrincipalMembership memberships = 3;
}
message GetPrincipalResponse { AccessPrincipal principal = 1; }

// AccessPolicy mirrors internal/domain/access.Policy: one Cedar policy
// document and the level-scope tuple that places it in the chain.
message AccessPolicy {
  string policy_id = 1;
  string level = 2;
  string org_id = 3;
  string workspace_id = 4;
  string object_kind = 5;
  string object_id = 6;
  string text = 7;
}
message ListPoliciesRequest {}
message ListPoliciesResponse { repeated AccessPolicy policies = 1; }
message PutPolicyRequest { AccessPolicy policy = 1; }
message PutPolicyResponse { int64 version = 1; }
message DeletePolicyRequest { AccessPolicy policy = 1; }
message DeletePolicyResponse {}
message EnsureShippedOrgPoliciesRequest { string org_id = 1; }
message EnsureShippedOrgPoliciesResponse {}
// AccessDenial mirrors internal/domain/access.Denial: one refusal with the
// level that decided it and the deciding policies. The store coalesces
// identical denials within a minute into one row with a count.
message AccessDenial {
  string org_id = 1;
  string principal = 2;
  string action = 3;
  string resource_kind = 4;
  string resource_id = 5;
  string level = 6;
  repeated string policies = 7;
  int64 count = 8;
  google.protobuf.Timestamp at = 9;
}
message RecordDenialRequest { AccessDenial denial = 1; }
message RecordDenialResponse {}
message ListDenialsRequest {
  reserved 1;
  reserved "org_id";
  int32 limit = 2;
}
message ListDenialsResponse { repeated AccessDenial denials = 1; }

// Org mirrors internal/domain/org.Org: one tenant.
message Org {
  string id = 1;
  string name = 2;
}
// Workspace mirrors internal/domain/org.Workspace: a division of an org.
message Workspace {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string environment = 4;
}
// Member mirrors internal/domain/org.Member: a membership with the identity
// it names, as the dashboard lists it.
message Member {
  string identity_id = 1;
  string kind = 2;
  string display_name = 3;
  string workspace_id = 4;
  string role = 5;
}
message ListOrgsRequest {}
message ListOrgsResponse { repeated Org orgs = 1; }
message GetOrgRequest { string org_id = 1; }
message GetOrgResponse { Org org = 1; }
// CreateOrgRequest creates an org with its default workspace and its first
// owner. Only an instance admin may.
message CreateOrgRequest {
  string id = 1;
  string name = 2;
  string owner_identity_id = 3;
}
message CreateOrgResponse { Org org = 1; }
message ListWorkspacesRequest { string org_id = 1; }
message ListWorkspacesResponse { repeated Workspace workspaces = 1; }
message CreateWorkspaceRequest {
  string org_id = 1;
  string id = 2;
  string name = 3;
  string environment = 4;
}
message CreateWorkspaceResponse { Workspace workspace = 1; }
message ListMembersRequest { string org_id = 1; }
message ListMembersResponse { repeated Member members = 1; }
message SetMembershipRequest {
  string org_id = 1;
  string identity_id = 2;
  string workspace_id = 3;
  string role = 4;
}
message SetMembershipResponse {}
message RemoveMembershipRequest {
  string org_id = 1;
  string identity_id = 2;
  string workspace_id = 3;
}
message RemoveMembershipResponse {}
message AssignAgentRequest {
  string org_id = 1;
  string identity_id = 2;
}
message AssignAgentResponse {}

message RecentLogsRequest { logging.v1.LogQuery query = 1; }
message RecentLogsResponse { logging.v1.LogSnapshot snapshot = 1; }

// UsageRecord mirrors usage.Record. A task's record belongs to the task's
// org; any other belongs to the calling principal's org.
message UsageRecord {
  reserved 1;
  reserved "org_id";
  // source is task, chat or curator.
  string source = 2;
  int64 task_id = 3;
  int64 attempt = 4;
  string workflow = 5;
  string step = 6;
  string alias = 7;
  string provider = 8;
  string model = 9;
  int64 input_tokens = 10;
  int64 output_tokens = 11;
  int64 cached_tokens = 12;
  google.protobuf.Timestamp at = 13;
}
message RecordUsageRequest { UsageRecord record = 1; }
message RecordUsageResponse {}
message TaskModelsRequest { int64 task_id = 1; }
message TaskModelsResponse {
  string org_id = 1;
  map<string, string> aliases = 2;
  map<string, ModelProvider> providers = 3;
}
// ModelProvider is an org's own provider. Its key is the org's credential
// binding named after it.
message ModelProvider {
  string class = 1;
  string base_url = 2;
  string api_key_env = 3;
}
message CallerModelsRequest {}
message CallerModelsResponse {
  string org_id = 1;
  map<string, string> aliases = 2;
}
