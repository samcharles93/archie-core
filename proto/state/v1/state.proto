syntax = "proto3";

package state.v1;

import "logging/v1/logging.proto";

import "google/protobuf/timestamp.proto";

// StateStore is the single gRPC service fronting archie's PostgreSQL database.
// See docs/prds/state-store-contract.md for the ownership split: the
// workflow-domain Store view (Update/Transition/InsertEvent) is consumer-owned
// in internal/domain/workflow, while the rest of this surface is
// producer-owned in internal/domain/storecontract. Both are served by the same
// service over internal/infrastructure/postgres; the proto bypasses the Go
// interfacebloat cap (max 8), like gateway.v1.ChatService does.
service StateStoreService {
 rpc RecentLogs(RecentLogsRequest) returns (RecentLogsResponse);
  // Installed Archie packages. Administrative until org-scoped principals land.
  rpc InstallPackage(InstallPackageRequest) returns (InstallPackageResponse);
  // ListCatalogue returns the packages the instance's verified catalogue
  // offers; InstallFromCatalogue installs one by name at the digest it lists.
  rpc ListCatalogue(ListCatalogueRequest) returns (ListCatalogueResponse);
  rpc InstallFromCatalogue(InstallFromCatalogueRequest) returns (InstallFromCatalogueResponse);
  rpc GetInstalledPackage(GetInstalledPackageRequest) returns (GetInstalledPackageResponse);
  rpc ListInstalledPackages(ListInstalledPackagesRequest) returns (ListInstalledPackagesResponse);
  // AcceptPackageAuthority records the operator's accepted authority against
  // the pinned digest (the approve action; install is the create action).
  // Administrative until org-scoped principals land.
  rpc AcceptPackageAuthority(AcceptPackageAuthorityRequest) returns (AcceptPackageAuthorityResponse);
  rpc RemoveInstalledPackage(RemoveInstalledPackageRequest) returns (RemoveInstalledPackageResponse);
  // UpdatePackage moves a package to the digest the verified catalogue lists:
  // a non-widening update applies, a widening one waits as pending.
  // ApprovePackageUpdate applies the pending update and accepts its authority;
  // RollbackPackage restores the previous digest and its accepted authority.
  rpc UpdatePackage(UpdatePackageRequest) returns (UpdatePackageResponse);
  rpc ApprovePackageUpdate(ApprovePackageUpdateRequest) returns (ApprovePackageUpdateResponse);
  rpc RollbackPackage(RollbackPackageRequest) returns (RollbackPackageResponse);
  // SetPackageUpdatePolicy sets "manual" or "auto"; the State Store updates
  // auto packages on a timer.
  rpc SetPackageUpdatePolicy(SetPackageUpdatePolicyRequest) returns (SetPackageUpdatePolicyResponse);
  // Administrative task credential lifecycle. Worker credentials cannot call these.
  rpc RegisterTaskGrant(RegisterTaskGrantRequest) returns (RegisterTaskGrantResponse);
  rpc RevokeTaskGrant(RevokeTaskGrantRequest) returns (RevokeTaskGrantResponse);
  rpc ResolveTaskGrant(ResolveTaskGrantRequest) returns (ResolveTaskGrantResponse);
  // Identity domain. Task-scoped grants cannot call these administrative RPCs.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (CreateIdentityResponse);
  rpc RenameIdentity(RenameIdentityRequest) returns (RenameIdentityResponse);
  rpc SuspendIdentity(SuspendIdentityRequest) returns (SuspendIdentityResponse);
  rpc ReactivateIdentity(ReactivateIdentityRequest) returns (ReactivateIdentityResponse);
  rpc RetireIdentity(RetireIdentityRequest) returns (RetireIdentityResponse);
  // Subject bindings. A verified provider subject is resolved to the identity it
  // is bound to; the authenticating process calls these rather than owning the
  // identity store.
  rpc ResolveIdentitySubject(ResolveIdentitySubjectRequest) returns (ResolveIdentitySubjectResponse);
  rpc BindIdentitySubject(BindIdentitySubjectRequest) returns (BindIdentitySubjectResponse);
  rpc ClaimIdentitySubject(ClaimIdentitySubjectRequest) returns (ClaimIdentitySubjectResponse);
  // Personal API tokens act on the caller's own principal: the State Store
  // refuses a call that carries none.
  rpc AddPersonalToken(AddPersonalTokenRequest) returns (AddPersonalTokenResponse);
  rpc ListPersonalTokens(ListPersonalTokensRequest) returns (ListPersonalTokensResponse);
  rpc RevokePersonalToken(RevokePersonalTokenRequest) returns (RevokePersonalTokenResponse);
  // Lifecycle
  rpc EnqueueIssue(EnqueueIssueRequest) returns (EnqueueIssueResponse);
  rpc EnqueueChatTask(EnqueueChatTaskRequest) returns (EnqueueChatTaskResponse);
  rpc ActiveTasksByOrigin(ActiveTasksByOriginRequest) returns (ActiveTasksByOriginResponse);
  // UnpostedOutcomes lists finished chat tasks whose outcome has not yet been
  // posted to their conversation; MarkOutcomePosted records that it was.
  rpc UnpostedOutcomes(UnpostedOutcomesRequest) returns (UnpostedOutcomesResponse);
  rpc MarkOutcomePosted(MarkOutcomePostedRequest) returns (MarkOutcomePostedResponse);
  rpc ClaimNext(ClaimNextRequest) returns (ClaimNextResponse);
  rpc ClaimByIssue(ClaimByIssueRequest) returns (ClaimByIssueResponse);
  rpc Transition(TransitionRequest) returns (TransitionResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  // Step executions (docs/prds/execution-tree-state-machine.md). The run
  // credential authorises both on its own execution only.
  rpc StartStep(StartStepRequest) returns (StartStepResponse);
  // RecordUsage appends one model call's usage record. A run credential may
  // record usage only for its own task.
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);
  // TaskModels answers what a task's models resolve against: the aliases its
  // org may use and the org's own providers. The org is the task's, never
  // the caller's.
  rpc TaskModels(TaskModelsRequest) returns (TaskModelsResponse);
  // CallerModels answers the model aliases the caller's org may use. The org
  // is the calling principal's; a call with none is the system org's.
  rpc CallerModels(CallerModelsRequest) returns (CallerModelsResponse);
  rpc FinishStep(FinishStepRequest) returns (FinishStepResponse);
  // Cancellation. Deliberately administrative (deny-by-default for a
  // task-scoped grant): a cancel is a dashboard, API and dispatch action
  // decided by the Authorizer, not a worker call.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  // ListSteps is a dashboard/API/dispatch action (Authorizer: read on the
  // run), not task-scoped-grant callable like StartStep/FinishStep.
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);
  // Harness OAuth secrets (docs/prds/external-agent-harness.md,
  // Credentials). Administrative: the setup terminal (an `update` action on
  // the secret, Authorizer-gated) and the egress proxy's token-endpoint
  // interception (acting as the daemon, not a worker) are the only callers.
  rpc GetHarnessSecret(GetHarnessSecretRequest) returns (GetHarnessSecretResponse);
  rpc PutHarnessSecret(PutHarnessSecretRequest) returns (PutHarnessSecretResponse);
  rpc Requeue(RequeueRequest) returns (RequeueResponse);
  rpc ParkTask(ParkTaskRequest) returns (ParkTaskResponse);
  rpc RecoverStale(RecoverStaleRequest) returns (RecoverStaleResponse);

  // Archive / Retry
  rpc ArchiveTask(ArchiveTaskRequest) returns (ArchiveTaskResponse);
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  // RespondReviewGate is the operator's answer to the review gate
  // (docs/prds/pr-review-operator-response.md, Decision 2): one guarded
  // requeue that records the answer, increments rereview_rounds for a
  // re-review, and refuses a re-review past cap with the ErrRereviewCapReached
  // wire sentinel. Admin-only, like every other operator surface: a
  // task-scoped grant never reaches it.
  rpc RespondReviewGate(RespondReviewGateRequest) returns (RespondReviewGateResponse);
  rpc BeginRemediation(BeginRemediationRequest) returns (BeginRemediationResponse);
  rpc UpdateReviewPayload(UpdateReviewPayloadRequest) returns (UpdateReviewPayloadResponse);
  rpc SetReviewCursors(SetReviewCursorsRequest) returns (SetReviewCursorsResponse);

  // Queries
  rpc TaskByIssue(TaskByIssueRequest) returns (TaskByIssueResponse);
  rpc OpenTaskByPR(OpenTaskByPRRequest) returns (OpenTaskByPRResponse);
  rpc TaskByID(TaskByIDRequest) returns (TaskByIDResponse);
  rpc OpenPRs(OpenPRsRequest) returns (OpenPRsResponse);
  rpc ClearTerminalTasks(ClearTerminalTasksRequest) returns (ClearTerminalTasksResponse);
  rpc Tasks(TasksRequest) returns (TasksResponse);
  rpc StatusCounts(StatusCountsRequest) returns (StatusCountsResponse);

  // Events
  rpc InsertEvent(InsertEventRequest) returns (InsertEventResponse);
  rpc EventsSince(EventsSinceRequest) returns (EventsSinceResponse);
  rpc TaskEvents(TaskEventsRequest) returns (TaskEventsResponse);
  rpc WorkflowStats(WorkflowStatsRequest) returns (WorkflowStatsResponse);
  rpc StageStats(StageStatsRequest) returns (StageStatsResponse);
  rpc TokensByDay(TokensByDayRequest) returns (TokensByDayResponse);

  // Configuration snapshot: the running configuration as the dashboard
  // renders it, published by the owner of configuration for the process that
  // displays it. PutConfigSnapshot is administrative; GetConfigSnapshot is
  // the UI's read (docs/architecture/migration-decisions.md, "Dashboard
  // configuration page").
  rpc PutConfigSnapshot(PutConfigSnapshotRequest) returns (PutConfigSnapshotResponse);
  rpc GetConfigSnapshot(GetConfigSnapshotRequest) returns (GetConfigSnapshotResponse);

  // Channel status is what the process HOSTING the channels observes about them:
  // one row per channel, written by the Messaging Service and read by the UI
  // process. Administrative like the config snapshot, and for the same reason --
  // a task-scoped grant reaches neither, so authorizesTaskScopedCall admits only
  // the administrative token. It is runtime state rather than a settings
  // document, which is why it is not a ControlPlaneService resource kind.
  rpc PutChannelStatus(PutChannelStatusRequest) returns (PutChannelStatusResponse);
  rpc ListChannelStatus(ListChannelStatusRequest) returns (ListChannelStatusResponse);

  // Apply status: which version of a control-plane resource each process is
  // running, and why it could not. Every process that applies a resource
  // publishes; the UI process reads (docs/prds/control-plane-apply-status.md).
  // Both are administrative.
  rpc PutApplyStatus(PutApplyStatusRequest) returns (PutApplyStatusResponse);
  rpc ListApplyStatus(ListApplyStatusRequest) returns (ListApplyStatusResponse);

  // Presence: every running service instance re-stamps one record, so a
  // record past the staleness window means that instance is down.
  // Administrative.
  rpc PutPresence(PutPresenceRequest) returns (PutPresenceResponse);
  // Capture refusals: events the network rules refused at the receiver,
  // counted per source. Administrative.
  rpc RecordCaptureRefusal(RecordCaptureRefusalRequest) returns (RecordCaptureRefusalResponse);
  rpc ListCaptureRefusals(ListCaptureRefusalsRequest) returns (ListCaptureRefusalsResponse);
  rpc ListPresence(ListPresenceRequest) returns (ListPresenceResponse);

  // Task log: one task attempt's persisted log. Task log files live in the
  // state directory this process owns, so the dashboard reads them over this
  // contract rather than opening them itself
  // (docs/prds/ui-service-boundary.md).
  rpc ReadTaskLog(ReadTaskLogRequest) returns (ReadTaskLogResponse);
  // StreamTaskLogContent returns one attempt's log verbatim, one chunk per
  // message, for a download. A log file is unbounded input (it rotates at
  // DefaultMaxSizeMB), so a unary response would exceed gRPC's 4MiB message
  // cap on a real log -- the same reason ListCaptures was superseded by
  // StreamCaptures.
  rpc StreamTaskLogContent(StreamTaskLogContentRequest) returns (stream StreamTaskLogContentResponse);

  // Capture
  rpc InsertCapture(InsertCaptureRequest) returns (InsertCaptureResponse);
  // StreamCaptures returns one capture per message: a batch of large capture
  // bodies can exceed gRPC's 4MiB unary message cap
  // (docs/prds/state-store-contract.md).
  rpc StreamCaptures(StreamCapturesRequest) returns (stream StreamCapturesResponse);

  // Mapping
  rpc InsertMapping(InsertMappingRequest) returns (InsertMappingResponse);
  rpc GetMapping(GetMappingRequest) returns (GetMappingResponse);
  rpc ListMappings(ListMappingsRequest) returns (ListMappingsResponse);
  rpc UpdateMapping(UpdateMappingRequest) returns (UpdateMappingResponse);
  rpc DeleteMapping(DeleteMappingRequest) returns (DeleteMappingResponse);
  // RecordMappingMatch counts one event a mapping resolved; the same
  // (mapping, capture) twice counts once.
  rpc RecordMappingMatch(RecordMappingMatchRequest) returns (RecordMappingMatchResponse);

  // EventType (docs/prds/event-automation.md, "Event types"). Insert and
  // Update refuse an overlapping or malformed type.
  rpc InsertEventType(InsertEventTypeRequest) returns (InsertEventTypeResponse);
  rpc UpdateEventType(UpdateEventTypeRequest) returns (UpdateEventTypeResponse);
  rpc DeleteEventType(DeleteEventTypeRequest) returns (DeleteEventTypeResponse);
  rpc ListEventTypes(ListEventTypesRequest) returns (ListEventTypesResponse);

  // Binding
  rpc InsertBinding(InsertBindingRequest) returns (InsertBindingResponse);
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse);
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  rpc ListDispatches(ListDispatchesRequest) returns (ListDispatchesResponse);
  rpc UpdateBinding(UpdateBindingRequest) returns (UpdateBindingResponse);
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);
  rpc ApproveBinding(ApproveBindingRequest) returns (ApproveBindingResponse);
  rpc PauseBinding(PauseBindingRequest) returns (PauseBindingResponse);
  rpc ResumeBinding(ResumeBindingRequest) returns (ResumeBindingResponse);

  // Source (event-automation.md "Sources"): the capture endpoint and its
  // signing setting. Secrets travel in plaintext; the store encrypts at rest.
  rpc InsertSource(InsertSourceRequest) returns (InsertSourceResponse);
  rpc GetSource(GetSourceRequest) returns (GetSourceResponse);
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  rpc SetSourceSigning(SetSourceSigningRequest) returns (SetSourceSigningResponse);
  rpc SetSourceSecret(SetSourceSecretRequest) returns (SetSourceSecretResponse);
  rpc SetSourceName(SetSourceNameRequest) returns (SetSourceNameResponse);
  rpc SetSourceDeliveryHeader(SetSourceDeliveryHeaderRequest) returns (SetSourceDeliveryHeaderResponse);
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);

  // Dispatch
  rpc ArmedBindingsForSource(ArmedBindingsForSourceRequest) returns (ArmedBindingsForSourceResponse);
  rpc RecordDispatch(RecordDispatchRequest) returns (RecordDispatchResponse);
  rpc SetDispatchTask(SetDispatchTaskRequest) returns (SetDispatchTaskResponse);
  // Playbook dispatch ledger (eda-playbook-engine.md gap 2): one durable
  // at-most-once record per (playbook, version, event, action) for the
  // side-effecting positions. Administrative, like RecordDispatch: a
  // task-scoped grant cannot reach either (see TaskGrants).
  rpc RecordPlaybookDispatch(RecordPlaybookDispatchRequest) returns (RecordPlaybookDispatchResponse);
  rpc DeletePlaybookDispatches(DeletePlaybookDispatchesRequest) returns (DeletePlaybookDispatchesResponse);
  rpc StreamUndispatchedCaptures(StreamUndispatchedCapturesRequest) returns (stream StreamUndispatchedCapturesResponse);

  // BindingTaskCreator
  rpc EnqueueBindingTask(EnqueueBindingTaskRequest) returns (EnqueueBindingTaskResponse);

  // WorkflowCaller: a workflow.call step starts its callee and, with
  // wait:true, reads it back while waiting. Both are the one sanctioned
  // widening of a task-scoped grant -- the callee is the caller's child
  // (docs/prds/workflow-calls.md). CallStatus re-checks the parent-child
  // relation server-side, so the grant only names the caller.
  rpc EnqueueCallTask(EnqueueCallTaskRequest) returns (EnqueueCallTaskResponse);
  rpc WorkflowCallStatus(WorkflowCallStatusRequest) returns (WorkflowCallStatusResponse);

  // Access: the stored policy chain and its denial records
  // (docs/prds/orgs-and-access.md). ListPolicies is the engine's snapshot;
  // the writes are administrative. RecordDenial is the dashboard's and
  // dispatch's write path; ListDenials is the operator surface.
  // The principal assembly the Authorizer evaluates: an identity, the org
  // it serves, and its memberships (internal/domain/access).
  rpc GetPrincipal(GetPrincipalRequest) returns (GetPrincipalResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc PutPolicy(PutPolicyRequest) returns (PutPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc EnsureShippedOrgPolicies(EnsureShippedOrgPoliciesRequest) returns (EnsureShippedOrgPoliciesResponse);
  rpc RecordDenial(RecordDenialRequest) returns (RecordDenialResponse);
  rpc ListDenials(ListDenialsRequest) returns (ListDenialsResponse);

  // Orgs, workspaces, memberships and agent assignments
  // (docs/prds/orgs-and-access.md). Every request names an org, but the
  // State Store acts in the org the caller's principal carries: a request
  // org that is not the caller's is ignored, so the contract cannot reach
  // another tenant. Instance-admin widening is a later change.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc SetMembership(SetMembershipRequest) returns (SetMembershipResponse);
  rpc RemoveMembership(RemoveMembershipRequest) returns (RemoveMembershipResponse);
  rpc AssignAgent(AssignAgentRequest) returns (AssignAgentResponse);
}

message RegisterTaskGrantRequest {
  int64 task_id = 1;
  string token = 2;
  int64 lifetime_seconds = 3;
}
message RegisterTaskGrantResponse {}
message RevokeTaskGrantRequest {
  string token = 1;
}
message RevokeTaskGrantResponse {}
// ResolveTaskGrantRequest names a run credential; the response is the task
// it was issued for.
message ResolveTaskGrantRequest { string token = 1; }
message ResolveTaskGrantResponse { int64 task_id = 1; }

message Identity {
  string id = 1;
  string kind = 2;
  string display_name = 3;
  string lifecycle = 4;
  int64 version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message IdentityAudit {
  string actor_id = 1;
  string source = 2;
  string request_id = 3;
}
message ListIdentitiesRequest {}
message ListIdentitiesResponse { repeated Identity identities = 1; }
message GetIdentityRequest { string id = 1; }
message GetIdentityResponse { Identity identity = 1; }
message CreateIdentityRequest {
  string id = 1;
  string kind = 2;
  string display_name = 3;
  IdentityAudit audit = 4;
}
message RenameIdentityRequest {
  string id = 1;
  int64 expected_version = 2;
  string display_name = 3;
  IdentityAudit audit = 4;
}
message SuspendIdentityRequest { string id = 1; int64 expected_version = 2; IdentityAudit audit = 3; }
message ReactivateIdentityRequest { string id = 1; int64 expected_version = 2; IdentityAudit audit = 3; }
message RetireIdentityRequest { string id = 1; int64 expected_version = 2; IdentityAudit audit = 3; }
message CreateIdentityResponse { Identity identity = 1; }
message RenameIdentityResponse { Identity identity = 1; }
message SuspendIdentityResponse { Identity identity = 1; }
message ReactivateIdentityResponse { Identity identity = 1; }
message RetireIdentityResponse { Identity identity = 1; }
message ResolveIdentitySubjectRequest {
  string issuer = 1;
  string subject = 2;
}
message ResolveIdentitySubjectResponse { Identity identity = 1; }
message BindIdentitySubjectRequest {
  string id = 1;
  string issuer = 2;
  string subject = 3;
  IdentityAudit audit = 4;
}
message BindIdentitySubjectResponse { Identity identity = 1; }
message ClaimIdentitySubjectRequest {
  string issuer = 1;
  string placeholder = 2;
  string subject = 3;
}
message ClaimIdentitySubjectResponse { Identity identity = 1; }

// PersonalToken identifies a token by the SHA-256 it binds as; the token
// itself never reaches the State Store.
message PersonalToken {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
}
message AddPersonalTokenRequest { string id = 1; }
message AddPersonalTokenResponse {}
message ListPersonalTokensRequest {}
message ListPersonalTokensResponse { repeated PersonalToken tokens = 1; }
message RevokePersonalTokenRequest { string id = 1; }
message RevokePersonalTokenResponse {}

// Task mirrors internal/domain/workflow.Task.
message Task {
  int64 id = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  string title = 5;
  string body = 6;
  string labels = 7;
  string status = 8;
  string workflow = 9;
  // Retired: the per-task "current stage" column was overwritten as
  // workflow.Run advanced and carried no history. step_executions is the
  // durable per-step record now (docs/prds/execution-tree-state-machine.md);
  // ListSteps is its read.
  string stage = 10 [deprecated = true];
  string branch = 11;
  string plan = 12;
  string notes = 13;
  int64 pr_number = 14;
  int64 tokens_used = 15;
  int64 iterations = 16;
  int64 attempt = 17;
  string park_reason = 18;
  int64 retry_count = 19;
  int64 watch_comment_id = 20;
  string source = 21;
  string identity = 22;
  string binding_id = 23;
  int64 binding_version = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  // review_payload is the JSON-encoded review unit the remediate workflow's
  // current run must address (docs/prds/pr-review-remediation.md decision 4).
  string review_payload = 27;
  // The workflow pin: the exact definition version this run started with.
  // It has to cross the wire for the daemon's digest guard to hold, because
  // a retry reads the task back over this contract before deciding whether
  // to reuse the pinned YAML (docs/prds/runtime-control-plane.md:95).
  int64 workflow_definition_version = 28;
  string workflow_definition_digest = 29;
  string workflow_definition_yaml = 30;
  // review_cursor is the poll backstop's high-water mark over forge review
  // IDs for this task. It is separate from watch_comment_id (the review-
  // comment cursor) because the two forge sequences are independent; one
  // combined cursor would silently skip reviews once a larger comment ID
  // landed (docs/prds/pr-review-remediation.md decision 2).
  int64 review_cursor = 31;
  // park_class is the producer-recorded answer to "what kind of
  // intervention does this park need?" (taskstate.ParkClass:
  // needs_human, transient, terminal). Store-side normalization makes
  // empty and unknown values needs_human, so the class is advisory on
  // the wire and authoritative only as recorded at the park site.
  string park_class = 32;
  // remediation_rounds counts review-triggered remediation rounds
  // separately from retry_count, so an operator's manual retries no
  // longer draw down the review-remediation budget (and vice versa).
  int32 remediation_rounds = 33;
  // inputs_json is the JSON object of workflow inputs a binding dispatch
  // resolved (task.EncodeInputs); empty for a task no binding started.
  string inputs_json = 34;
  // org is the org the task belongs to, derived store-side from the task's
  // identity when the row is written; a task of a single-operator install
  // belongs to the default org (docs/prds/orgs-and-access.md).
  string org = 35;
  // The workflow.call linkage (docs/prds/workflow-calls.md): the task whose
  // workflow.call step started this one (0 on a root run) and how many
  // call hops this row is from that root. Columns default, so an older
  // writer reads as a depth-0 root run.
  int64 call_parent_task_id = 36;
  int32 call_depth = 37;
  // outputs_json is the JSON object of declared-output values this run wrote
  // (task.EncodeOutputs), empty for a run that wrote none. The container's
  // Update sends the whole row, so a column the message cannot carry is a
  // column that write drops (docs/prds/workflow-call-outputs.md, "Storage and
  // wire").
  string outputs_json = 38;
  // review_gate is the operator-approval gate's whole conversation with the
  // operator (docs/prds/pr-review-operator-response.md): the offer the gate
  // wrote before waiting, and the answer the response path filled in. It is
  // opaque here -- internal/domain/workflow/prreview owns the encoding -- but
  // it must cross so the dashboard can render the offer and the resumed run
  // can read the answer.
  string review_gate = 39;
  // rereview_rounds counts granted operator re-reviews, capped by
  // prreview.MaxRereviewRounds in the guarded response write. It is separate
  // from retry_count and remediation_rounds for the same reason those are
  // separate from each other.
  int64 rereview_rounds = 40;
  // retry_mode is the operator's worktree choice for the next dispatch
  // (taskstate.RetryMode: refresh_onto_base, continue_pushed_work). The retry
  // action writes it and the daemon's prepareWorkspace reads it, so it must
  // cross the wire for a retry to land on the source the operator chose. The
  // empty string reads as refresh_onto_base.
  string retry_mode = 41;
  // resume_from is the stage the next attempt starts at; empty runs every
  // stage. resume_results are the step results (JSON) it starts with.
  string resume_from = 42;
  bytes resume_results = 43;
  // origin names the conversation that created the task; empty for none.
  string origin = 44;
}

// Event mirrors internal/events.Event. Data is carried as a JSON object
// string (matching the store's own on-disk representation) rather than
// google.protobuf.Struct, to stay a direct mirror of the existing column.
message Event {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  string kind = 3;
  int64 task_id = 4;
  string repo = 5;
  int64 issue = 6;
  string workflow = 7;
  string stage = 8;
  // attempt is the run this event belongs to. Zero means UNATTRIBUTED, not a
  // first attempt: rows written before the field existed, and the deliberately
  // task-agnostic producers, all carry zero. A reader must report those as
  // unattributable rather than presenting them as one run.
  int64 attempt = 11;
  string detail = 9;
  string data_json = 10;
  // Attribution. actor_id is the identity that performed the action and
  // actor_kind its kind, so a reader can tell an agent's action from a person's
  // without resolving the identity. principal_id is the identity whose authority
  // the action used, which is a different fact when an agent acts under a
  // person's standing approval; empty means unattributed. All three must cross
  // this boundary: a record whose attribution survives only in `detail` is not
  // queryable, which is the attribution this design exists to replace.
  string actor_id = 12;
  string actor_kind = 13;
  string principal_id = 14;
}

// CapturedEvent mirrors storecontract.CapturedEvent.
message CapturedEvent {
  string id = 1;
  google.protobuf.Timestamp received_at = 2;
  string source = 3;
  string remote_addr = 4;
  string content_type = 5;
  string headers = 6;
  string body = 7;
  bool authenticated = 8;
  // event_type is the ID of the event type the capture was identified as on
  // arrival; empty is unidentified.
  string event_type = 9;
  // unsigned marks an event taken on an approved unsigned source.
  bool unsigned = 10;
  // delivery names the sender's delivery; a retry of one delivery shares it.
  // Intake sets it from the source's delivery header; empty takes the
  // capture ID.
  string delivery = 11;
}

// EventTypeHeaderCondition mirrors internal/domain/eventtype.HeaderCondition.
message EventTypeHeaderCondition {
  string name = 1;
  string value = 2;
}

// EventTypePayloadCondition mirrors internal/domain/eventtype.PayloadCondition.
message EventTypePayloadCondition {
  string path = 1;
  string op = 2;
  string value = 3;
}

// EventType mirrors internal/domain/eventtype.EventType. header_conditions and
// payload_conditions are its rule; schema maps each payload path to its type.
message EventType {
  string id = 1;
  string source = 2;
  string name = 3;
  repeated EventTypeHeaderCondition header_conditions = 4;
  repeated EventTypePayloadCondition payload_conditions = 5;
  map<string, string> schema = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// MappingField mirrors internal/domain/mapping.Field.
message MappingField {
  string name = 1;
  string path = 2;
  string type = 3;
  bool required = 4;
}

// Mapping mirrors internal/domain/mapping.Mapping.
message Mapping {
  string id = 1;
  string name = 2;
  string source_hint = 3;
  repeated MappingField fields = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
