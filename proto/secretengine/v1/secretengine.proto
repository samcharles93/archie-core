syntax = "proto3";

package secretengine.v1;

// SecretEngineService is the surface a secret-engine extension serves. The
// host launches one plugin process per enabled engine and resolves every
// SecretRef naming that engine through it.
service SecretEngineService {
  // Configure hands the engine its settings once, right after launch and
  // before any Resolve. It is the only channel for configuration: the plugin
  // process does not inherit the host environment.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Resolve returns the value for key. An unknown key is NOT_FOUND.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

message ConfigureRequest { map<string, string> settings = 1; }
message ConfigureResponse {}
message ResolveRequest { string key = 1; }
message ResolveResponse { string value = 1; }
