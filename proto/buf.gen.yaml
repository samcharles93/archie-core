version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/samcharles93/archie-core/internal/contracts
plugins:
  - local: protoc-gen-go
    out: ../internal/contracts
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../internal/contracts
    opt: paths=source_relative
