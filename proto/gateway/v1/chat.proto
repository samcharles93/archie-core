syntax = "proto3";

package gateway.v1;

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc RecentMessages(RecentMessagesRequest) returns (RecentMessagesResponse);
  rpc RecentTurns(RecentTurnsRequest) returns (RecentTurnsResponse);
  rpc Route(RouteRequest) returns (RouteResponse);
  rpc Stream(StreamRequest) returns (stream StreamResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc SetPersona(SetPersonaRequest) returns (SetPersonaResponse);
}

message Session {
  string session_id = 1;
  string platform = 2;
  string bot_user = 3;
  string channel_id = 4;
  string thread_id = 5;
  string title = 6;
  string parent_session_id = 7;
  string branch_name = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_active_at = 10;
}
message Message {
  string message_id = 1;
  string source_id = 2;
  string channel_id = 3;
  string thread_id = 4;
  string from = 5;
  string text = 6;
  string page = 7;
  google.protobuf.Timestamp at = 8;
}
message ToolCall {
  string id = 1;
  string name = 2;
  string parameters = 3;
  string output = 4;
  string error = 5;
}
message Media {
  string tool_name = 1;
  string type = 2;
  string file_id = 3;
  string url = 4;
  string path = 5;
  string mime_type = 6;
  string file_name = 7;
  optional int64 file_size = 8;
  optional int64 width = 9;
  optional int64 height = 10;
  optional int64 duration = 11;
}
message Turn {
  string turn_id = 1;
  string session_id = 2;
  string source_id = 3;
  string status = 4;
  int64 attempt = 5;
  string owner_id = 6;
  string input_message_id = 7;
  string assistant_message_id = 8;
  string partial_text = 9;
  string response_text = 10;
  repeated ToolCall tool_calls = 11;
  string error = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}
message StringList { repeated string values = 1; }
message SnapshotRequest {}
message SnapshotResponse {
  repeated Session sessions = 1;
  repeated string models = 2;
  map<string, StringList> models_by_provider = 3;
  repeated string providers = 4;
  string active_model = 5;
  string active_provider = 6;
  repeated string personas = 7;
  map<string, string> active_personas = 8;
  bool restart_available = 9;
  bool cancellation_available = 10;
  bool personas_available = 11;
}
message GetSessionRequest { string session_id = 1; }
message GetSessionResponse { Session session = 1; bool found = 2; }
message RecentMessagesRequest { string session_id = 1; int64 limit = 2; }
message RecentMessagesResponse { repeated Message messages = 1; }
message RecentTurnsRequest { string session_id = 1; int64 limit = 2; }
message RecentTurnsResponse { repeated Turn turns = 1; }
message RouteRequest { Message message = 1; }
message RouteResponse { string text = 1; string session_id = 2; }
message StreamRequest { Message message = 1; }
message StreamResponse {
  string kind = 1;
  string text = 2;
  string session_id = 3;
  ToolCall tool = 4;
  Media media = 5;
}
message CancelRequest { string session_id = 1; }
message CancelResponse { bool cancelled = 1; int64 dropped = 2; }
message SetPersonaRequest { string session_id = 1; string name = 2; }
message SetPersonaResponse { bool found = 1; }
