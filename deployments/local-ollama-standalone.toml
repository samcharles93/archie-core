# ==============================================================================
# Self-Hosted Ollama + Standalone Mode Deployment Example
#
# Runs local open-weights models via Ollama (e.g. llama3, qwen2.5) with forge
# polling disabled (standalone execution mode).
# ==============================================================================

work_dir = "~/.local/share/archie/work"
db_path  = "~/.local/share/archie/archie.db"

[services.gateway]
target = "127.0.0.1:8585"
poll_interval = "60s"

# The State Store gRPC service owns the single archie.db SQLite file; archied
# and archie-gateway dial it and never open archie.db themselves (§12 step 7).
# Host-only deployment: the agent runs on the host, so the loopback target
# 127.0.0.1:9090 needs no token. Start archie-state-store with the matching
# `-listen 127.0.0.1:9090`.
[services.state]
target = "127.0.0.1:9090"

# Standalone execution: Forge polling is disabled
[forge]
type = "none"

[models]
triage  = "ollama/llama3:latest"
planner = "ollama/llama3:latest"
builder = "ollama/llama3:latest"

[providers.ollama]
class = "ollama"

# Optional chat workspace configuration
[chat]
operator = "Local Operator"
workspace = "~/.local/share/archie/workspace"
max_steps = 100
models = [
  "ollama/llama3:latest",
  "ollama/qwen2.5:7b"
]

[budgets]
max_steps = 60
wall_clock = "30m"
