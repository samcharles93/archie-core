# ==============================================================================
# Single-Forge GitHub Deployment Example
#
# Manages multiple GitHub repositories using a single bot account and token.
# One [forge] block applies to ALL [[repos]] entries below.
# ==============================================================================

work_dir = "~/.local/share/archie/work"
db_path  = "~/.local/share/archie/archie.db"
poll_interval = "60s"
label = "archie"
bot_user = "archie-bot"
bot_email = "archie-bot@users.noreply.github.com"
diff_cap_lines = 400

# The Gateway Service owns conversational state and serves ChatContract over
# gRPC. Run archie-gateway alongside archied and archie-ui (the dashboard
# process dials it too) with this address.
[services.gateway]
target = "127.0.0.1:8585"

# The State Store gRPC service owns the single archie.db SQLite file. archied
# and archie-gateway dial it here and never open archie.db themselves
# (docs/prds/state-store-contract.md §12 step 7). This deployment runs the
# agent in containers, so the target must be the Docker bridge gateway address
# (172.17.0.1) that the container can reach, and a non-loopback target requires
# a matching target_token that archie-state-store validates -- start it with the
# same token (e.g. `archie-state-store ... -listen 172.17.0.1:9090 -token
# change-me-state-store-token`). For a host-only agent (no [containers]) use the
# loopback target 127.0.0.1:9090 with no token.
[services.state]
target = "172.17.0.1:9090"
target_token = "change-me-state-store-token"

[forge]
type = "github"
host = "https://github.com"
token = { engine = "env", key = "ARCHIE_GITHUB_TOKEN" }

[dispatch]
trigger = "assignee"      # "assignee", "label", or "either"
ack_reaction = "eyes"    # Emoji reaction on issue pickup

[dispatch.labels]
queued  = "archie:queued"
working = "archie:working"
waiting = "archie:waiting"
pr      = "archie:pr"
parked  = "archie:parked"

[models]
triage  = "openai/gpt-4o"
planner = "openai/gpt-4o"
builder = "openai/gpt-4o"

[providers.openai]
class = "openai"
api_key_env = "OPENAI_API_KEY"

[nats]
mode = "embedded"

[containers]
# Pinned to a verified digest -- archie-agent has no published semver tag
# yet (CI only pushes :latest). See
# deployments/systemd-user-service.md#pinning-the-archie-agent-image.
image = "ghcr.io/samcharles93/archie-agent@sha256:870f1b1357979cfea23fccacb24166ebeb9ab321708ef2c2b218a763ed99b090"
pull_policy = "missing"

[budgets]
max_steps = 60
wall_clock = "30m"

# List of repositories managed by this single GitHub forge configuration:
[[repos]]
owner = "my-org"
name = "frontend-app"
base = "main"
ecosystem = "node"

[[repos]]
owner = "my-org"
name = "backend-service"
base = "main"
ecosystem = "go"
gate = [
  ["go", "vet", "./..."],
  ["go", "test", "./...", "-count=1"]
]

[[repos]]
owner = "my-org"
name = "shared-library"
base = "main"
ecosystem = "go"
