# ==============================================================================
# Multi-Forge (GitHub + Gitea) Deployment Example
#
# Runs GitHub and a self-hosted Gitea instance simultaneously.
# Each [[identities]] entry defines its own forge, token, and repository list.
# Each identity runs in an isolated background goroutine and worktree directory.
# ==============================================================================

work_dir = "~/.local/share/archie/work"
db_path  = "~/.local/share/archie/archie.db"

[services.gateway]
target = "127.0.0.1:8585"
poll_interval = "60s"

# The State Store gRPC service owns the single archie.db SQLite file; archied
# and archie-gateway dial it and never open archie.db themselves (§12 step 7).
# This deployment runs the agent in containers, so target is the Docker bridge
# gateway (172.17.0.1) the container can reach, with a matching target_token
# that archie-state-store validates. Host-only agent: use 127.0.0.1:9090 with
# no token.
[services.state]
target = "172.17.0.1:9090"
target_token = "change-me-state-store-token"

[models]
triage  = "openai/gpt-4o"
planner = "openai/gpt-4o"
builder = "openai/gpt-4o"

[providers.openai]
class = "openai"
api_key_env = "OPENAI_API_KEY"

[nats]
mode = "embedded"

[containers]
# Pinned to a verified digest -- archie-agent has no published semver tag
# yet (CI only pushes :latest). See
# deployments/systemd-user-service.md#pinning-the-archie-agent-image.
image = "ghcr.io/samcharles93/archie-agent@sha256:870f1b1357979cfea23fccacb24166ebeb9ab321708ef2c2b218a763ed99b090"
pull_policy = "missing"

[budgets]
max_steps = 60
wall_clock = "30m"

# ------------------------------------------------------------------------------
# Identity 1: GitHub Bot
# ------------------------------------------------------------------------------
[[identities]]
name = "github-bot"
bot_user = "archie-github"
bot_email = "archie-github@users.noreply.github.com"

[identities.forge]
type = "github"
host = "https://github.com"
token = { engine = "env", key = "ARCHIE_GITHUB_TOKEN" }

[identities.dispatch]
trigger = "assignee"
ack_reaction = "eyes"

[[identities.repos]]
owner = "my-org"
name = "github-repo-one"
ecosystem = "go"

[[identities.repos]]
owner = "my-org"
name = "github-repo-two"
ecosystem = "node"

# ------------------------------------------------------------------------------
# Identity 2: Self-Hosted Gitea Bot
# ------------------------------------------------------------------------------
[[identities]]
name = "gitea-bot"
bot_user = "archie-gitea"
bot_email = "archie-gitea@example.com"

[identities.forge]
type = "gitea"
host = "https://gitea.example.com"
token = { engine = "env", key = "ARCHIE_GITEA_TOKEN" }

[identities.dispatch]
trigger = "label"
ack_reaction = "eyes"

[[identities.repos]]
owner = "internal-team"
name = "gitea-repo-alpha"
ecosystem = "go"

[[identities.repos]]
owner = "internal-team"
name = "gitea-repo-beta"
ecosystem = "python"
