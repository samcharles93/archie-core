# ==============================================================================
# Minimal event-driven deployment: no forge, no repositories
#
# Events arrive as webhooks at the dashboard and run workflows. Models run
# locally through Ollama; for a hosted provider replace [providers.ollama] with
# e.g. [providers.openai] class = "openai", api_key_env = "OPENAI_API_KEY"
# and change the model names to "openai/<model>".
# ==============================================================================

# Standalone still needs a bot identity: it names the agent that chat turns and
# the session curator attribute memory to, and it becomes the seeded identity's
# display name when there is no [[identities]] block.
bot_user = "archie"

work_dir = "~/.local/share/archie/work"
state_dir = "~/.local/share/archie"   # NATS store, task logs
# PostgreSQL 18 connection (required).
# `docker compose up -d postgres` provides this local default; point it at
# your own Postgres 18 server otherwise.
database_url = "postgres://archie:archie@127.0.0.1:5432/archie?sslmode=disable"

[services.gateway]
target = "127.0.0.1:8585"

# The State Store gRPC service owns the PostgreSQL task data; archied and
# archie-gateway dial it and never open those tables themselves.
# Host-only deployment: the agent runs on the host, so the loopback target
# 127.0.0.1:9090 needs no token. Start archie-state-store with the matching
# `-listen 127.0.0.1:9090`.
[services.state]
target = "127.0.0.1:9090"

# Standalone execution: Forge polling is disabled
[forge]
type = "none"

[models]
triage  = "ollama/llama3:latest"
planner = "ollama/llama3:latest"
builder = "ollama/llama3:latest"

[providers.ollama]
class = "ollama"

# Optional chat workspace configuration
[chat]
operator = "Local Operator"
workspace = "~/.local/share/archie/workspace"
max_steps = 100
models = [
  "ollama/llama3:latest",
  "ollama/qwen2.5:7b"
]

[budgets]
max_steps = 60
wall_clock = "30m"
