site_name: Archie
site_description: Event Driven Agentic Automation
site_url: https://offloaded.dev/docs/
repo_url: https://github.com/samcharles93/archie-core
edit_uri: edit/main/docs/
copyright: Vectis Labs

# The published set and the reasons for what is held back now live in
# tools/docsite/main.go, which emits the canonical artifact a renderer reads
# (docs/data/generated/docs.json). MkDocs is being retired, so its exclusions are
# not duplicated here: a second copy of a decision is a second thing to keep true.

# The generated release-notes pages are linked from docs/news/index.md and stay
# published, but they are kept out of the derived navigation: a version list
# that grows with every release would push the architecture tree off the screen.
# This is not exclude_docs -- the pages are wanted, just not as nav entries.
not_in_nav: |
  news/[0-9]*

theme:
  name: material
  favicon: public/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

# No nav block on purpose. MkDocs derives the tree from the directory layout, so
# adding a page under docs/architecture/ publishes it without a second edit here.
# A hand-maintained nav is one more thing that goes stale against 600 commits a
# month.
